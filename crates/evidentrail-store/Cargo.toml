[package]
name = "evidentrail-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Bounded TTL result storage and exact expansion for Evidentrail"

[features]
default = []
internal-test-provider = []

[dependencies]
evidentrail-core.workspace = true
evidentrail-schema.workspace = true
evidentrail-snapshot-format.workspace = true
getrandom.workspace = true
sha2.workspace = true
zeroize.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }

[lints]
workspace = true
