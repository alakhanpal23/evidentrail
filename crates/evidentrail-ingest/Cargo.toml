[package]
name = "evidentrail-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Bounded byte-exact source adapters for Evidentrail"

[features]
cloudwatch-sdk = ["dep:aws-config", "dep:aws-sdk-cloudwatchlogs", "dep:aws-sdk-sts", "dep:tokio"]

[dependencies]
aws-config = { version = "=1.8.13", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-sdk-cloudwatchlogs = { version = "=1.116.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "=1.97.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
evidentrail-core.workspace = true
evidentrail-schema.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time"] }
zeroize.workspace = true

[lints]
workspace = true
