name: contract-gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo run -p evidentrail-wire --all-features --bin evidentrail-wire-schema -- --check

  feature-partition:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p evidentrail-wire --no-default-features --features local-file
      - run: cargo check -p evidentrail-wire --no-default-features --features ledger
      - run: cargo check -p evidentrail-wire --no-default-features --features product
      - run: cargo check -p evidentrail-wire --no-default-features --features bench
      - run: cargo check -p evidentrail-wire --no-default-features --features all-contracts

  macos-local-file:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p evidentrail-wire --no-default-features --features local-file
      - run: cargo test -p evidentrail-local-file
