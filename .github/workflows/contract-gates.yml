name: contract-gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4, 2026-07-16
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        if: matrix.toolchain == '1.88.0'
      - run: bash -n scripts/production-qualification.sh
      # Keep warnings-as-errors linting reproducible as new stable Clippy adds lints.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: matrix.toolchain == '1.88.0'
      - run: cargo test --workspace --all-targets
      - run: cargo test -p evidentrail-ingest --features cloudwatch-sdk
        if: matrix.toolchain == '1.88.0'
      - run: cargo run -p evidentrail-wire --all-features --bin evidentrail-wire-schema -- --check

  feature-partition:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4, 2026-07-16
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
      - run: cargo check -p evidentrail-wire --no-default-features --features local-file
      - run: cargo check -p evidentrail-wire --no-default-features --features ledger
      - run: cargo check -p evidentrail-wire --no-default-features --features product
      - run: cargo check -p evidentrail-wire --no-default-features --features bench
      - run: cargo check -p evidentrail-wire --no-default-features --features all-contracts

  macos-workspace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4, 2026-07-16
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
      - run: cargo test --workspace --all-targets
      - run: cargo test -p evidentrail-wire --no-default-features --features local-file
